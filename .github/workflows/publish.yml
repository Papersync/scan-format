name: Publish
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest && npm --version
      - run: npm ci && npm run build
      - name: Stage publish of an existing version (must be rejected; shows the OIDC exchange result)
        run: npm stage publish --provenance --access public --loglevel verbose 2>&1 | grep -i -E "oidc|stage|exchange|E4[0-9][0-9]|error" | grep -v -i "token\":" || true
