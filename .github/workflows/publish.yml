name: OIDC diagnose
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print token claims and try the npm token exchange (no publish, no secrets printed)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub,repository,repository_id,repository_owner,repository_owner_id,workflow_ref,job_workflow_ref,ref,event_name,environment,runner_environment}' || true
          CODE=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@papersync%2fscan-format)
          echo "exchange HTTP $CODE"
          jq 'if has("token") then {token:"<redacted>"} + (del(.token)) else . end' resp.json
          rm -f resp.json
